# Render Blueprint: creates the production API service from this repository (New > Blueprint).
# Secrets are marked sync: false: Render asks for each value once and never stores them in git.
services:
  - type: web
    name: zoove-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore        # closest Render region to the Mumbai database
    plan: starter            # always on (the free plan sleeps and would make the sign-in page time out)
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        value: https://join.zoove.co,https://admin.zoove.co
      - key: TRAINER_SITE_URL
        value: https://join.zoove.co
      - key: ADMIN_URL
        value: https://admin.zoove.co
      - key: SMS_PROVIDER
        value: msg91
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: Zoove <hello@zoove.co>
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        value: trainer-docs
      - key: S3_REGION
        value: ap-south-1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: PII_SECRET
        sync: false          # paste a random 32+ character value ONCE and back it up: losing it makes stored PAN numbers unreadable
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OPS_NOTIFY_EMAILS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
