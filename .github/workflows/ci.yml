name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  api-database:
    # Runs the API tests that need a real database (sign-in, tokens, catalog).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zoove_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash services/api/scripts/prepare-test-db.sh
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm --filter @zoove/api test
      - name: Replay every request in services/api/api-client against the running API
        run: |
          psql "$TEST_DATABASE_URL" -c "truncate otp_challenges, refresh_tokens, user_roles, users, outbox_events cascade"
          psql "$TEST_DATABASE_URL" -c "update clusters set status = 'active', activated_at = now() where slug = 'bandra-khar'"
          pnpm --filter @zoove/api build
          node services/api/dist/main.js > api.log 2>&1 &
          sleep 8
          API_URL=http://localhost:3000 node services/api/api-client/smoke.mjs || (cat api.log; exit 1)
        env:
          NODE_ENV: development
          PORT: 3000
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-1234
          OTP_SECRET: ci-only-otp-secret-ci-only-otp-secret-1234
          DEV_FIXED_OTP: '123456'
